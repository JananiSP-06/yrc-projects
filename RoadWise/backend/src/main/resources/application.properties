# ---- RoadWise backend configuration. Override any value with an environment variable. ----
spring.application.name=roadwise-backend
server.port=${SERVER_PORT:8080}

# MySQL 8. The database is created automatically if the MySQL user is allowed to.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roadwise?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Inanaj@2006!}

# Tables come from db/schema.sql (see docs). Hibernate only maps to them.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never

# First run only: load sample data and create the admin account.
roadwise.seed.enabled=${SEED_ENABLED:true}
roadwise.admin.username=${ADMIN_USERNAME:admin}
# If ADMIN_PASSWORD is empty, a random password is generated and printed once in the log.
roadwise.admin.password=${ADMIN_PASSWORD:}

# Frontend origins allowed to call the API (comma separated).
roadwise.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
